[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChemEmbed"
version = "1.1.1"
description = "A deep learning framework for metabolite identification using enhanced MS/MS data and multidimensional molecular embeddings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Muhammad Faizan Khan" }
]

keywords = [
    "mass-spectrometry",
    "metabolomics",
    "metabolite-identification",
    "molecular-embeddings",
    "deep-learning",
    "MS/MS",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.18.0",
    "pandas>=1.0.0",
    "scipy>=1.4.0",
    "torch>=1.13.0",
    "pyYAML>=5.3.0",
    "rdkit >=2020.09.1",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
# Reading a .parquet reference database. Not a default dependency because the .pkl
# form works without it, so a plain install stays lean.
parquet = ["pyarrow>=8"]

# The batch entry point (chemembed.chemembed_by_file) searches the whole embedding
# space with FAISS before filtering by precursor mass, which is worthwhile when
# annotating many samples at once. faiss-cpu is what PyPI can install; the GPU build
# comes from conda (`conda install -c pytorch faiss-gpu`) and is the one you want on a
# GPU node. The default single-file path does NOT need FAISS: it filters by precursor
# mass first, which leaves a handful of candidates to score directly.
faiss = ["faiss-cpu>=1.7"]

[project.urls]
Homepage = "https://github.com/faizanurv/ChemEmbed"
Repository = "https://github.com/faizanurv/ChemEmbed"
Issues = "https://github.com/faizanurv/ChemEmbed/issues"

[project.scripts]
chemembed = "chemembed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

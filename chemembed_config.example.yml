# =============================================================================
# ChemEmbed configuration template  (chemembed_by_file.py / chemembed_per_spectrum.py)
# =============================================================================
# Copy to chemembed_config.yml and fill in the paths for your machine:
#
#     cp chemembed_config.example.yml chemembed_config.yml
#
# chemembed_config.yml is gitignored, so local absolute paths never get committed.
# =============================================================================

# ── Input data ───────────────────────────────────────────────────────────────
# Root directory holding one sub-directory per sample. Each sample is expected to
# contain <sample>/<ionization>/ with the GNPS/SIRIUS MGF to annotate.
treated_data_path: /path/to/results
ionization: pos            # 'pos' or 'neg'

# ── ChemEmbed installation ───────────────────────────────────────────────────
# Directory containing model_utils.py / reference_utils.py / data_processing.py.
# Prepended to sys.path at startup.
chemembed_root: /path/to/ChemEmbed/ChemEmbed

# ── Model paths ──────────────────────────────────────────────────────────────
model_path_positive: /path/to/data_model_files/model_positive.bin
model_path_negative: /path/to/data_model_files/model_negative.bin

# ── Reference database ───────────────────────────────────────────────────────
# Accepts either .pkl/.pickle or .parquet — the format is sniffed by extension and
# then by content, so an existing pickle path keeps working unchanged. Parquet is
# smaller, version-portable and allows single-column reads.
reference_database: /path/to/data_model_files/chemembed_reference_mol2vec_300d_520k.parquet

# ── Processing parameters ────────────────────────────────────────────────────
tolerance: 0.01
max_mz: 700
resolution: 0.01
intensity_threshold: 1
top_n_candidates: 5

# ── Performance (FAISS GPU edition) ──────────────────────────────────────────
batch_size: 32     # CNN inference batch size; raise to 64/128 if the GPU has memory
num_workers: 0     # DataLoader worker processes; 4 is a good value on a multi-core node
faiss_k: 200       # FAISS candidates retrieved before the precursor m/z post-filter.
                   # Raise if the run reports a high "Fallback used" count.

# ── Behaviour ────────────────────────────────────────────────────────────────
recompute: false   # true re-runs samples that already have chemembed_results.csv
